name: Test notStartsWith comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-pass
        uses: .
        with:
          expected: "world"
          actual: "hello world"
          comparison: notStartsWith
      - name: Assert notStartsWith passes when actual does not start with expected
        env:
          ACTUAL: ${{ steps.action-pass.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "passed" ]; then
            echo "FAIL: expected 'passed' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - id: action-fail
        uses: .
        with:
          expected: "hello"
          actual: "hello world"
          comparison: notStartsWith
        continue-on-error: true
      - name: Assert notStartsWith fails when actual starts with expected
        env:
          ACTUAL: ${{ steps.action-fail.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "failed" ]; then
            echo "FAIL: expected 'failed' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
